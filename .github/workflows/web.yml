name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_PREFIX: /${{ github.event.repository.name }}/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit testy (výpočty a sdílené moduly)
        run: npm test
      - name: Sestavení webu
        run: npx eleventy
      - name: Kontrola přístupnosti, přetečení a požadavků
        run: npm run kontrola
      - name: E2E testy
        run: npm run test:e2e
      - name: Lighthouse
        run: npm run lighthouse
      - name: Sestavení včetně nezveřejněných nástrojů (jen pro testy)
        run: ZOBRAZIT_SKRYTE=1 npx eleventy --output=_site-vse
      - name: Kontrola a e2e nezveřejněných nástrojů
        run: |
          SITE_DIR=_site-vse npm run kontrola -- penize/zdanim-to/ penize/zdanim-to/dividendy/
          npm run test:e2e:skryte
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
